[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krowser"
version = "0.1.0"
description = "Browse resources in a Kubernetes cluster"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "kubernetes>=30.1.0,<31",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["krowser"]
